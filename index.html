<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Embassy - Bản Đồ Thú Cưng Đài Loan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Trang trí cho bản đồ */
        #map { 
            height: 450px; 
            width: 100%; 
            border-radius: 20px; 
            border: 6px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .leaflet-popup-content-wrapper { border-radius: 12px; font-family: sans-serif; }
    </style>
</head>
<body class="bg-pink-50 min-h-screen font-sans">

    <header class="bg-white border-b-4 border-yellow-400 p-4 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🏛️</span>
                <h1 class="text-xl font-black text-yellow-700 uppercase tracking-tighter">Pet Embassy</h1>
            </div>
            <button onclick="openModal()" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 px-5 py-2 rounded-xl font-bold shadow-sm transition-all active:scale-95">
                + 客人推薦
            </button>
        </div>
    </header>

    <section class="bg-yellow-400 p-6">
        <div class="container mx-auto">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-yellow-900">Bản Đồ Thú Cưng Đài Loan 🐾</h2>
                <p class="text-yellow-800 italic text-sm">Tìm kiếm quán cafe, công viên và trạm thú y tốt nhất.</p>
            </div>
            <div id="map"></div>
        </div>
    </section>

    <main class="container mx-auto py-8 px-4">
        <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            ✨ Địa điểm nổi bật tại Đài Loan
        </h3>
        <div id="place-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">📍 Đánh dấu địa điểm mới</h2>
            <form id="pet-form" class="space-y-4">
                <input type="text" id="name" placeholder="Tên địa điểm (VD: Cafe Cún Con)" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-yellow-400 outline-none" required>
                <select id="type" class="w-full border-2 border-gray-100 p-3 rounded-xl">
                    <option value="cafe">☕ Quán Cafe</option>
                    <option value="park">🌳 Công viên</option>
                    <option value="vet">🏥 Trạm thú y</option>
                </select>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tiện ích:</label>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <label><input type="checkbox" value="Bát nước"> 💧 Bát nước</label>
                        <label><input type="checkbox" value="Rào chắn"> 🚪 Rào chắn</label>
                        <label><input type="checkbox" value="Đồ chơi"> 🧸 Đồ chơi</label>
                        <label><input type="checkbox" value="Thức ăn"> 🦴 Thức ăn</label>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-400 font-bold">Hủy</button>
                    <button type="submit" class="bg-yellow-400 text-yellow-900 px-6 py-2 rounded-xl font-bold">Chia sẻ ngay</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. Khởi tạo bản đồ - Đặt tâm tại Đài Bắc (Taipei)
        var map = L.map('map').setView([25.0330, 121.5654], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 2. Dữ liệu các địa điểm tại Đài Loan
        let embassyPlaces = [
            {
                name: "Yingfeng Riverside Dog Park",
                lat: 25.0715, lng: 121.5562,
                type: "park",
                amenities: ["Rào chắn", "Bồn rửa chân"],
                rating: "5/5 🐾"
            },
            {
                name: "Kitten Coffee Garden",
                lat: 25.1023, lng: 121.5285,
                type: "cafe",
                amenities: ["Bát nước", "Thức ăn mèo"],
                rating: "4.8/5 🐾"
            },
            {
                name: "National Taiwan University Vet",
                lat: 25.0175, lng: 121.5405,
                type: "vet",
                amenities: ["Cấp cứu 24/7", "Uy tín"],
                rating: "5/5 🐾"
            },
            // --- KHU VỰC ĐÀI BẮC (TAIPEI) ---
            {
                name: "Huashan 1914 Creative Park",
                lat: 25.0440, lng: 121.5290,
                type: "park",
                amenities: ["Cỏ xanh", "Cho phép mang thú cưng vào triển lãm"],
                rating: "4.5/5 🐾"
            },
            {
                name: "PS Bu Bu Cafe (Vườn Sao Băng)",
                lat: 25.1165, lng: 121.5335,
                type: "cafe",
                amenities: ["Xe cổ trong quán", "Được bế thú cưng ngồi cùng"],
                rating: "4.7/5 🐾"
            },
            // --- KHU VỰC TÂN BẮC (NEW TAIPEI) ---
            {
                name: "Houtong Cat Village (Làng Mèo)",
                lat: 25.0863, lng: 121.8267,
                type: "park",
                amenities: ["Thiên đường mèo", "Nhiều trạm nghỉ"],
                rating: "5/5 🐾"
            },
            {
                name: "Bitan Scenic Area",
                lat: 24.9540, lng: 121.5370,
                type: "park",
                amenities: ["Đạp vịt cùng pet", "Đường dạo bộ ven sông"],
                rating: "4.6/5 🐾"
            },
            // --- KHU VỰC ĐÀI TRUNG (TAICHUNG) ---
            {
                name: "Calligraphy Greenway",
                lat: 24.1500, lng: 120.6630,
                type: "park",
                amenities: ["Khu phố đi bộ", "Rất nhiều người dắt chó đi dạo"],
                rating: "4.9/5 🐾"
            },
            {
                name: "Two Cats Taichung",
                lat: 24.1450, lng: 120.6600,
                type: "cafe",
                amenities: ["Không gian yên tĩnh", "Bánh ngọt cho chủ & pet"],
                rating: "4.5/5 🐾"
            },
            {
                name: "Tamsui Riverside Park",
                lat: 25.1742, lng: 121.4325,
                type: "park",
                amenities: ["Ngắm hoàng hôn", "Đường chạy ven sông siêu dài"],
                rating: "4.7/5 🐾"
            },
            {
                name: "Taichung Wen-Xin Forest Park",
                lat: 24.1465, lng: 120.6450,
                type: "park",
                amenities: ["Bãi cỏ cực rộng", "Khu vực rào chắn an toàn"],
                rating: "4.8/5 🐾"
            },
            {
                name: "NTU Veterinary Hospital (Taipei)",
                lat: 25.0175, lng: 121.5405,
                type: "vet",
                amenities: ["Cấp cứu 24/7", "Đội ngũ chuyên gia đầu ngành", "Thiết bị hiện đại"],
                rating: "5/5 🐾"
            },
            {
                name: "Yang-Ming Veterinary Hospital",
                lat: 25.1015, lng: 121.5200,
                type: "vet",
                amenities: ["Chuyên nội khoa", "Bác sĩ tận tâm", "Phòng khám sạch sẽ"],
                rating: "4.6/5 🐾"
            },
            {
                name: "Veterinary Medical Center (Tainan)",
                lat: 22.9930, lng: 120.2170,
                type: "vet",
                amenities: ["Phẫu thuật kỹ thuật cao", "Dịch vụ chăm sóc sau mổ"],
                rating: "4.8/5 🐾"
            },
            
        ];

        // 3. Hàm hiển thị địa điểm lên Bản đồ và Danh sách
        function render() {
            const listContainer = document.getElementById('place-list');
            listContainer.innerHTML = ''; 

            embassyPlaces.forEach(place => {
                // Thêm ghim lên bản đồ
                // Thêm ghim lên bản đồ
L.marker([place.lat, place.lng])
    .addTo(map)
    .bindPopup(`
        <div style="min-width: 150px;">
            <b style="font-size: 14px;">${place.name}</b><br>
            <span style="color: #666; font-size: 12px;">${place.type === 'cafe' ? '☕ Quán Cafe' : (place.type === 'park' ? '🌳 Công viên' : '🏥 Thú y')}</span><br>
            <div style="margin-top: 10px;">
                <a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}" 
                   target="_blank" 
                   style="background: #4285F4; color: white; padding: 5px 10px; border-radius: 5px; text-decoration: none; font-size: 12px; font-weight: bold; display: inline-block;">
                   <i class="fas fa-directions"></i> Chỉ đường (Google Maps)
                </a>
            </div>
        </div>
    `);

                // Thêm thẻ bài vào danh sách dưới bản đồ
                const tags = place.amenities.map(item => 
                    `<span class="bg-green-100 text-green-700 text-[10px] px-2 py-1 rounded-md mr-1 font-bold">#${item}</span>`
                ).join('');

                const card = `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-yellow-100">
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-bold uppercase text-gray-400">${place.type}</span>
                            <span class="text-yellow-500 font-bold">${place.rating}</span>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 mt-1">${place.name}</h3>
                        <div class="mt-3 flex flex-wrap gap-y-2">${tags}</div>
                    </div>
                `;
                listContainer.innerHTML += card;
            });
        }

        // 4. Đóng/Mở Modal
        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        // 5. Xử lý khi nhấn Submit (Thêm tạm thời)
        document.getElementById('pet-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Cảm ơn bạn! Địa điểm sẽ được admin phê duyệt và hiện lên bản đồ sau.");
            closeModal();
        });

        // Chạy lần đầu
        render();
    </script>
</body>
</html>
