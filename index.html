<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Embassy - Bản Đồ Thú Cưng Đài Loan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { height: 450px; width: 100%; border-radius: 20px; border: 6px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 10; }
        .leaflet-popup-content-wrapper { border-radius: 12px; font-family: sans-serif; }
        .amenity-checkbox { accent-color: #eab308; width: 18px; height: 18px; cursor: pointer; }
        /* Hiệu ứng loading khi đang tìm địa chỉ */
        .loading-shimmer { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-pink-50 min-h-screen font-sans">

    <header class="bg-white border-b-4 border-yellow-400 p-4 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🐾</span>
                <h1 class="text-xl font-black text-yellow-700 uppercase tracking-tighter">Pet Embassy</h1>
            </div>
            <button onclick="openModal()" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 px-5 py-2 rounded-xl font-bold shadow-sm transition-all active:scale-95">
                + 客人推薦
            </button>
        </div>
    </header>

    <section class="bg-yellow-400 p-6">
        <div class="container mx-auto">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-yellow-900">Bản Đồ Thú Cưng Đài Loan </h2>
                <p class="text-yellow-800 italic text-sm">Tìm kiếm quán cafe, công viên và trạm thú y tốt nhất.</p>
            </div>

            <div class="max-w-5xl mx-auto mb-6 bg-white p-4 rounded-2xl shadow-md flex flex-wrap items-center gap-4">
                <div class="flex-1 min-w-[200px] flex items-center gap-2 px-3 bg-gray-50 rounded-xl border border-gray-100">
                    <i class="fas fa-search text-gray-400"></i>
                    <input type="text" id="search-input" oninput="render()" placeholder="Tìm tên hoặc địa chỉ..." class="w-full bg-transparent py-2 text-sm outline-none text-gray-700">
                </div>
               
                <select id="filter-type" onchange="render()" class="bg-gray-50 border border-gray-100 px-3 py-2 rounded-xl text-sm font-bold text-gray-700 outline-none cursor-pointer">
                    <option value="all">🌟 Tất cả</option>
                    <option value="cafe">☕ Cafe</option>
                    <option value="park">🌳 Công viên</option>
                    <option value="vet">🏥 Thú y</option>
                </select>

                <div class="flex flex-wrap gap-4 items-center text-sm font-bold text-gray-700">
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" value="Bát nước" onchange="render()" class="amenity-checkbox filter-check"> 💧 Bát nước</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" value="Rào chắn" onchange="render()" class="amenity-checkbox filter-check"> 🧱 Rào chắn</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" value="Đồ chơi" onchange="render()" class="amenity-checkbox filter-check"> 🧸 Đồ chơi</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" value="Thức ăn" onchange="render()" class="amenity-checkbox filter-check"> 🦴 Thức ăn</label>
                </div>
            </div>

            <div id="map"></div>
        </div>
    </section>

    <main class="container mx-auto py-8 px-4">
        <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">📍 Địa điểm nổi bật</h3>
        <div id="place-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-2 flex items-center gap-2">🎁 Gợi ý địa điểm mới</h2>
            <p class="text-xs text-gray-500 mb-4 italic">Hệ thống sẽ tự động xác định vị trí dựa trên địa chỉ bạn nhập.</p>
           
            <form id="pet-form" class="space-y-4">
                <input type="text" id="modal-name" placeholder="Tên địa điểm (VD: Cafe Cún Con)" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-yellow-400 outline-none" required>
               
                <input type="text" id="modal-address" placeholder="Nhập địa chỉ (VD: Taipei 101)" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-yellow-400 outline-none" required>

                <select id="modal-type" class="w-full border-2 border-gray-100 p-3 rounded-xl">
                    <option value="cafe">☕ Quán Cafe</option>
                    <option value="park">🌳 Công viên</option>
                    <option value="vet">🏥 Trạm thú y</option>
                </select>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tiện ích sẵn có:</label>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <label class="flex items-center gap-2"><input type="checkbox" class="modal-amenity" value="Bát nước"> Bát nước</label>
                        <label class="flex items-center gap-2"><input type="checkbox" class="modal-amenity" value="Rào chắn"> Rào chắn</label>
                        <label class="flex items-center gap-2"><input type="checkbox" class="modal-amenity" value="Đồ chơi"> Đồ chơi</label>
                        <label class="flex items-center gap-2"><input type="checkbox" class="modal-amenity" value="Thức ăn"> Thức ăn</label>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-400 font-bold">Hủy</button>
                    <button type="submit" id="submit-btn" class="bg-yellow-400 text-yellow-900 px-6 py-2 rounded-xl font-bold">Chia sẻ ngay</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var map = L.map('map').setView([25.0330, 121.5654], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
        var markerGroup = L.layerGroup().addTo(map);

        let embassyPlaces = [
            { name: "Yingfeng Riverside Dog Park", address: "Taipei, Taiwan", lat: 25.0715, lng: 121.5562, type: "park", amenities: ["Rào chắn", "Bát nước"], rating: "5/5" },
            { name: "Kitten Coffee Garden", address: "Shilin, Taipei", lat: 25.1023, lng: 121.5285, type: "cafe", amenities: ["Bát nước", "Thức ăn"], rating: "4.8/5" },
            { name: "National Taiwan University Vet", address: "Da’an, Taipei", lat: 25.0175, lng: 121.5405, type: "vet", amenities: ["Thức ăn", "Đồ chơi"], rating: "5/5" }
        ];

        function render() {
            const listContainer = document.getElementById('place-list');
            listContainer.innerHTML = '';
            markerGroup.clearLayers();

            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            const filterType = document.getElementById('filter-type').value;
            const checkedAmenities = Array.from(document.querySelectorAll('.filter-check:checked')).map(cb => cb.value);

            const filteredPlaces = embassyPlaces.filter(place => {
                const matchesSearch = place.name.toLowerCase().includes(searchQuery) || place.address.toLowerCase().includes(searchQuery);
                const matchesType = (filterType === 'all') || (place.type === filterType);
                const matchesAmenities = checkedAmenities.every(a => place.amenities.includes(a));
                return matchesSearch && matchesType && matchesAmenities;
            });

            filteredPlaces.forEach(place => {
                L.marker([place.lat, place.lng]).addTo(markerGroup)
                 .bindPopup(`<b>${place.name}</b><br><small>${place.address}</small><br>Rating: ${place.rating}`);
               
                const tags = place.amenities.map(a => `<span class="bg-green-100 text-green-700 text-[10px] px-2 py-1 rounded-md mr-1 font-bold">#${a}</span>`).join('');
                listContainer.innerHTML += `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-yellow-100">
                        <div class="flex justify-between items-start text-xs font-bold uppercase text-gray-400">
                            <span>${place.type}</span> <span class="text-yellow-500">${place.rating}</span>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 mt-1">${place.name}</h3>
                        <p class="text-xs text-gray-400 mb-2 truncate"><i class="fas fa-map-marker-alt"></i> ${place.address}</p>
                        <div class="mt-3 flex flex-wrap gap-y-2">${tags}</div>
                    </div>`;
            });
        }

        // LOGIC TÌM TỌA ĐỘ THẬT TỪ ĐỊA CHỈ
        document.getElementById('pet-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const name = document.getElementById('modal-name').value;
            const address = document.getElementById('modal-address').value;
            const type = document.getElementById('modal-type').value;
            const amenities = Array.from(document.querySelectorAll('.modal-amenity:checked')).map(cb => cb.value);

            btn.innerText = "Đang tìm vị trí...";
            btn.disabled = true;

            try {
                // Sử dụng API miễn phí của OpenStreetMap để chuyển địa chỉ thành tọa độ
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const newPlace = {
                        name: name,
                        address: data[0].display_name, // Lấy địa chỉ chuẩn từ hệ thống
                        type: type,
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon),
                        amenities: amenities,
                        rating: "Mới 🆕"
                    };

                    embassyPlaces.push(newPlace);
                    render();
                   
                    // Di chuyển bản đồ đến chỗ vừa thêm
                    map.setView([newPlace.lat, newPlace.lng], 15);
                   
                    e.target.reset();
                    closeModal();
                    alert("Thêm thành công địa điểm tại: " + data[0].display_name);
                } else {
                    alert("Không tìm thấy địa chỉ này. Vui lòng nhập chi tiết hơn (ví dụ thêm tên thành phố).");
                }
            } catch (error) {
                alert("Lỗi kết nối hệ thống địa chỉ.");
            } finally {
                btn.innerText = "Chia sẻ ngay";
                btn.disabled = false;
            }
        });

        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        render();
    </script>
</body>
</html>
